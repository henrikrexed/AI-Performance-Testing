name: Deploy docs site to GitHub Pages

# Builds the KnightLoad Docusaurus site in website/ and deploys it to GitHub Pages.
#
# Prerequisites (one-time, repo admin — board/Henrik):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The deploy itself uses the built-in GITHUB_TOKEN (pages: write below); it does
# NOT need a personal PAT. A fine-grained PAT with Contents:write + Workflows:write
# is only needed to push this workflow file and website/ into the repo in the
# first place.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable the Pages site from within the workflow (uses GITHUB_TOKEN
          # with pages: write) so no repo-admin step or admin PAT is required.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
