name: release

# Cross-platform engine binaries + skills bundle + installers + GitHub Release.
#
# On every version tag `v*`, build the workload-model engine CLI as standalone,
# dependency-light binaries — one per OS/arch — with PyInstaller (the engine is
# pure-Python 3.12 with `jsonschema` as its only runtime dependency, so a one-file
# bundle is clean and needs no native toolchain). Each binary gets a CycloneDX SBOM.
#
# The Release also carries the installable distribution (release-pipeline
# completion workstream):
#   * `workload-engine-skills-<ver>.tar.gz|zip` — the skills/ tree + core usage
#     docs, so `workload-engine init --from <dir>` works from assets alone,
#     with no repo clone;
#   * `install.sh` / `install.ps1` — one-liner installers that fetch the binary
#     + skills bundle for the detected platform, verify SHA256SUMS, unpack, and
#     run `init`;
#   * `SHA256SUMS` + per-asset `.sha256` sidecars covering every binary and
#     bundle asset.
#
# The multi-arch container image is built and pushed by a SEPARATE pipeline
# (`docker.yml`) so image builds also run on PRs/main for CI + Trivy scanning,
# and so there is exactly ONE place that pushes to GHCR. This workflow does not
# build or push any image.
#
# Trigger: push a tag like `v0.1.0`, or run manually (workflow_dispatch) to
# smoke-test the build matrix + bundle assembly without publishing a Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release and upload binary + SBOM assets

env:
  BINARY_NAME: workload-engine

jobs:
  # ---------------------------------------------------------------------------
  # 1. Cross-platform binaries. PyInstaller cannot cross-compile, so each target
  #    is built on a native runner (linux arm64 uses the GA `ubuntu-24.04-arm`
  #    runner — no QEMU emulation, which is slow and flaky for PyInstaller).
  #    darwin-amd64 (Intel Mac) is not built: GitHub-hosted Intel macOS runners
  #    no longer exist (verified: the macos-13 matrix leg sat queued with no
  #    runner while every other leg went green). Intel Macs install the
  #    darwin-arm64 binary via Rosetta 2 — the installers map them
  #    automatically and the release notes say so.
  # ---------------------------------------------------------------------------
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            data_sep: ":"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            data_sep: ":"
          - os: macos-latest
            target: darwin-arm64
            data_sep: ":"
          - os: windows-latest
            target: windows-amd64
            data_sep: ";"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller "jsonschema>=4,<5"

      - name: Build one-file binary
        shell: bash
        run: |
          # Package the maintained `engine/` CLI — the one the docs describe and
          # that carries the `init` + `guided` subcommands and the current
          # `archetypes` extract schema. (The legacy `skills/workload-model/scripts/`
          # engine predates both; building it is what left v0.1.0 without `guided`
          # and KeyError'ing on the current CrewAI example.)
          # Version stamp: tag -> 0.1.6; dispatch -> sanitized branch name. Baked
          # into the binary via engine/_version.py so `--version` reports it.
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//\//-}"
          printf '__version__ = "%s"\n' "$VERSION" > engine/_version.py
          python -m PyInstaller --noconfirm --onefile --clean \
            --name "$BINARY_NAME" \
            --paths engine \
            --add-data "engine/schema.json${{ matrix.data_sep }}." \
            --hidden-import shaping --hidden-import archetypes \
            --hidden-import clustering --hidden-import emit \
            --hidden-import g0_gate --hidden-import source_merge \
            --hidden-import driver --hidden-import _version \
            engine/cli.py

      - name: Smoke test the binary
        shell: bash
        run: |
          BIN="dist/$BINARY_NAME"
          [ "${{ matrix.target }}" = "windows-amd64" ] && BIN="dist/$BINARY_NAME.exe"
          "$BIN" --help
          "$BIN" --version
          # agentic: the current CrewAI example (the extract v0.1.0 KeyError'd on)
          "$BIN" --extract examples/crewai-deepseek-agent/extract.json \
                 --out out_agentic --mode agentic
          test -f out_agentic/workload-model.json
          test -f out_agentic/scenario-proposal.md
          # the guided 4-step driver is packaged (init + guided subcommands)
          "$BIN" guided --extract examples/crewai-deepseek-agent/extract.json \
                 --out out_guided --mode agentic --yes
          test -f out_guided/guided-state.json

      - name: Stage release asset
        id: stage
        shell: bash
        run: |
          mkdir -p staged
          ASSET="${BINARY_NAME}-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "windows-amd64" ]; then
            cp "dist/$BINARY_NAME.exe" "staged/${ASSET}.exe"
            echo "asset=staged/${ASSET}.exe" >> "$GITHUB_OUTPUT"
          else
            cp "dist/$BINARY_NAME" "staged/${ASSET}"
            echo "asset=staged/${ASSET}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SBOM for the binary
        uses: anchore/sbom-action@v0
        with:
          file: ${{ steps.stage.outputs.asset }}
          format: cyclonedx-json
          output-file: staged/${{ env.BINARY_NAME }}-${{ matrix.target }}.cyclonedx.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: staged/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Skills bundle: the `skills/` tree + the core usage docs, packed once per
  #    ref. Gives the installers (and `workload-engine init --from …`) a
  #    checksum-verified source that requires no repo clone. Runs on dispatch
  #    too, so bundle assembly is smoke-tested without publishing.
  # ---------------------------------------------------------------------------
  skills-bundle:
    name: skills bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble skills bundle (tar.gz + zip)
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"          # tag -> 0.1.5; dispatch -> branch name
          VERSION="${VERSION//\//-}"              # dispatch branch refs contain '/'; asset names must not
          ROOT="knightload-skills-${VERSION}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/$ROOT"
          cp -r skills "$STAGE/$ROOT/skills"
          mkdir -p "$STAGE/$ROOT/docs"
          cp README.md "$STAGE/$ROOT/"
          cp docs/engine.md docs/skills-install.md docs/requirements.md "$STAGE/$ROOT/docs/"
          # sanity: every skill keeps its SKILL.md marker (init --from checks it)
          for d in skills/*/; do
            test -f "$STAGE/$ROOT/$d/SKILL.md" || { echo "bundle: missing $d/SKILL.md" >&2; exit 1; }
          done
          mkdir -p staged
          tar czf "staged/${BINARY_NAME}-skills-${VERSION}.tar.gz" -C "$STAGE" "$ROOT"
          (cd "$STAGE" && zip -qr "$GITHUB_WORKSPACE/staged/${BINARY_NAME}-skills-${VERSION}.zip" "$ROOT")
          # sanity: the tarball unpacks to exactly one top-level dir with skills/ inside
          test "$(tar tzf "staged/${BINARY_NAME}-skills-${VERSION}.tar.gz" | head -1 | cut -d/ -f1)" = "$ROOT"
          tar tzf "staged/${BINARY_NAME}-skills-${VERSION}.tar.gz" | grep -q "skills/workload-model/SKILL.md"
          ls -la staged

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skills-bundle
          path: staged/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publish the GitHub Release: every binary + SBOM, the skills bundle, the
  #    one-liner installers, and SHA256SUMS covering all of them.
  #    Tag pushes only; runs after the matrix + bundle jobs (always(): publish
  #    whatever legs succeeded).
  # ---------------------------------------------------------------------------
  release:
    name: github release
    needs: [binaries, skills-bundle]
    # always(): publish whatever binaries built, so one flaky/slow runner (e.g. a scarce
    # macOS-Intel queue) can't block the Release. download-artifact only fetches the
    # legs that actually uploaded.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage one-liner installers
        run: |
          cp install/install.sh dist/install.sh
          cp install/install.ps1 dist/install.ps1

      - name: List assets
        run: ls -la dist

      - name: Compute image tag (semver, v stripped)
        # The docker workflow pushes GHCR tags via docker/metadata-action semver
        # patterns, which strip the leading `v` (`v0.1.3` -> `0.1.3`). Publish the
        # matching pull command — the raw `github.ref_name` 404s in GHCR.
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate SHA256SUMS + per-asset sidecars
        run: |
          cd dist
          # SHA256SUMS covers every release asset except checksum files themselves
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name '*.sha256' -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          # sidecar checksums for the installable assets the installers fetch
          for f in "$BINARY_NAME"-linux-* "$BINARY_NAME"-darwin-* \
                   "$BINARY_NAME"-windows-*.exe "$BINARY_NAME"-skills-*.tar.gz \
                   "$BINARY_NAME"-skills-*.zip install.sh install.ps1; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum -c SHA256SUMS

      - name: Create release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## AI-Performance-Testing — workload-model engine ${{ github.ref_name }}

            Standalone builds of the SCOPE-stage engine CLI (`workload-engine --extract … --out … --mode commerce|agentic`, plus `init` / `guided` subcommands).

            **One-liner install (linux / macOS)** — fetches the binary + skills bundle for your platform, verifies `SHA256SUMS`, installs the skills via `workload-engine init`, prints the quickstart:

            ```sh
            curl -fsSL https://github.com/henrikrexed/AI-Performance-Testing/releases/latest/download/install.sh | sh
            ```

            **Windows (PowerShell):**

            ```powershell
            irm https://github.com/henrikrexed/AI-Performance-Testing/releases/latest/download/install.ps1 | iex
            ```

            **Binaries** (attached, each with a CycloneDX SBOM): `linux-amd64`,
            `linux-arm64`, `darwin-arm64`, `windows-amd64`. Intel Macs: the
            installer fetches the `darwin-arm64` binary, which runs via Rosetta 2.

            **Skills bundle**: `workload-engine-skills-${{ env.IMAGE_TAG }}.tar.gz|zip` —
            `skills/` + core docs; install into your coding agent with
            `workload-engine init --from <unpacked-dir>`.

            **Integrity**: `SHA256SUMS` covers every asset; per-asset `.sha256`
            sidecars sit next to the binaries and bundles.

            **Container image** (built + pushed by the `docker` workflow):
            `docker pull ghcr.io/henrikrexed/ai-performance-testing:${{ env.IMAGE_TAG }}`
            (multi-arch: amd64 + arm64).

            Install and usage: see
            [`docs/engine.md`](https://github.com/henrikrexed/AI-Performance-Testing/blob/main/docs/engine.md).
